[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dtbr-mc"
version = "0.2.0"
description = "Deep-time behavioral risk Monte Carlo simulator for falsification-oriented hazard communication research."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.13",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "typer>=0.12",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["dtbr_mc*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
