# North American flora with an INDEPENDENT-USE reward (NAEB).
#
# This is the cleanest provenance separation we have: reward is documented
# Native American medicinal use (NAEB "Drug" records), which is unrelated to the
# chemistry/occurrence/interaction cues. It directly tests the project's actual
# question -- does ecological structure predict the plants people adopted? -- and,
# with `coupling --control`, whether that holds once research coverage is removed.
#
# Requires the manually-downloaded bundles in data_external/:
#   data_external/naeb_src/...      (NAEB dump: species/uses)
#   data_external/duke_src/...      (full Dr. Duke's CSVs, for the chemistry cue)
# First run hits GBIF/OpenTree/GloBI; layers cache to Parquet.
seed: 12345
output_dir: results/live_naeb

data:
  source: live
  seed_mode: naeb
  reward_source: naeb_use
  cache_dir: data_cache_naeb
  external_dir: data_external
  n_species: 200            # most-documented NAEB medicinal species, resolved
  region:
    name: north_america
    min_lon: -170.0
    min_lat: 15.0
    max_lon: -52.0
    max_lat: 72.0
  seed_families: []

manifold:
  eco_edge_threshold: 0.10
  bio_edge_threshold: 0.05
  discovery_threshold: 0.05
  # Reward (NAEB Drug-use intensity) is graded; the most-documented NA plants are
  # nearly all medicinal, so the honest sparse task is "find the MOST medicinal":
  # keep the top quartile as the needles. The sweep varies this.
  reward_top_frac: 0.25

simulation:
  budget: 50
  n_replicates: 30
  observation_noise: 0.05

strategies:
  - {name: random,       kind: random,       params: {epsilon: 1.0}}
  - {name: phylogenetic, kind: phylogenetic, params: {epsilon: 0.08}}
  - {name: sensory,      kind: sensory,      params: {epsilon: 0.08}}
  - {name: ecological,   kind: ecological,   params: {epsilon: 0.08}}
  - {name: social,       kind: social,       params: {n_agents: 8, transmission_prob: 0.4}}
  - {name: cultural,     kind: cultural,     params: {epsilon: 0.05, learning_rate: 0.6}}
