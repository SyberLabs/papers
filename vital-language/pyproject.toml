[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vital-language"
version = "0.1.0"
description = "Research harness for testing coherence, agency, and structural vitality in language-model prose."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "SyberLabs" }]
dependencies = [
  "numpy>=1.26",
  "torch>=2.2",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
analysis = [
  "pandas>=2.0",
  "matplotlib>=3.8",
  "sentence-transformers>=2.7",
  "open-clip-torch>=2.24",
  "pronouncing>=0.2",
]
models = [
  "transformers>=4.40",
]

[tool.setuptools.packages.find]
include = ["vitality*"]
